<style>
/* Layout: one-screen game. Walkable autumn village + hanji-paper panels, persimmon accent. */
:root{
  --pine:#1b3127; --pine2:#24402f; --moss:#6f8f3c; --paper:#f2ecdf; --paper2:#e6dcc6;
  --ink:#2b2620; --ink2:#6b6152; --persimmon:#e46f27; --persimmon-d:#b9531a;
  --pinenut:#dcc38c; --chestnut:#6b3a1f; --poison:#b8372b; --good:#4f8a3a; --warn:#c98a12;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--pine);color:var(--paper);font-family:var(--body);font-size:15px;overflow:hidden;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pinenut);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);width:100%}
#main>.sec{max-width:860px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,calc((100% - 1100px)/2));background:var(--pine);border-bottom:1px solid #ffffff14}
.day{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--display);font-size:22px;line-height:1;color:var(--pinenut);white-space:nowrap;min-width:0;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.day small{overflow:hidden;text-overflow:ellipsis}
.day small{display:block;font-size:11px;color:#cfc6b0;font-family:var(--body);margin-top:3px}
.sta{flex:1;min-width:0}
.sta .lab{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden;font-size:12px;color:#cfc6b0;margin-bottom:4px;font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:9px;background:#ffffff1a;overflow:hidden}
.card .bar{background:#2b26201a}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),#9cbf54);border-radius:9px;transition:width .3s}
.money{flex:none;font-family:var(--display);font-size:19px;color:var(--paper);white-space:nowrap;font-variant-numeric:tabular-nums}
.money small{font-size:13px;color:var(--pinenut);margin-left:2px}
.sleep{flex:none;border:1px solid #ffffff30;background:#ffffff0d;border-radius:10px;padding:7px 10px;font-family:var(--display);font-size:14px;white-space:nowrap}

main{overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.sec{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:4px 0 0;color:var(--paper);text-wrap:balance}
.sub{color:#cfc6b0;font-size:13.5px;margin:-6px 0 2px;line-height:1.55}
h3{font-family:var(--display);font-weight:400;font-size:18px;margin:10px 0 0;color:var(--pinenut);letter-spacing:.02em}
.back{align-self:flex-start;border:1px solid #ffffff30;background:#ffffff0d;border-radius:10px;padding:6px 12px;font-family:var(--display);font-size:14px}

.card{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--paper2);color:var(--ink2);letter-spacing:.02em;white-space:nowrap}
.tag.need{background:#f6dcc7;color:var(--persimmon-d)}
.tag.ok{background:#dfe9cf;color:var(--good)}
.go{border:0;border-radius:12px;background:var(--persimmon);color:#fff;font-family:var(--display);font-size:15px;padding:10px 12px;min-width:66px;line-height:1.15}
.go small{display:block;font-size:11px;opacity:.85;font-family:var(--body)}
.go:disabled{background:#bfb5a2;color:#f2ecdf}
.btn{border:0;border-radius:10px;background:var(--persimmon);color:#fff;font-family:var(--display);font-size:14px;padding:8px 12px;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid #2b262033;color:var(--ink)}
.btn.moss{background:var(--good)}
.btn:disabled{background:#cfc5b1;color:#f6f1e6;border-color:transparent}

.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.it{background:var(--pine2);border:1px solid #ffffff12;border-radius:12px;padding:8px 4px 6px;text-align:center;font-size:12px;color:#ddd5c2}
.it svg{width:38px;height:38px;display:block;margin:0 auto 2px}
.it b{display:block;font-family:var(--display);font-weight:400;font-size:16px;color:var(--paper);font-variant-numeric:tabular-nums}
.it.zero{opacity:.38}
button.it.wf{font:inherit;font-size:12px;color:#ddd5c2;cursor:pointer;position:relative;display:block;width:100%}
button.it.wf i{position:absolute;top:4px;right:5px;font-style:normal;font-size:10px;background:#e4a640;color:#2a1a08;border-radius:8px;padding:0 5px;font-weight:700}
button.it.wf.on{opacity:1;border:2px solid #f2c230;background:#3e5a34;box-shadow:0 0 0 3px #f2c23033}
.wfhint{font-size:12px;color:#bfb79f;margin:0 0 6px}
.wfbox{margin:12px 0 4px;padding:10px;border:2px solid #f2c23088;border-radius:14px;background:#f2c23012;scroll-margin:12px}
.wfhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.wfhead>div{width:40px;height:40px;flex:none}.wfhead>div svg{width:100%;height:100%}
.wfhead span{flex:1;min-width:0;display:flex;flex-direction:column}.wfhead small{font-size:12px;color:#cfc6ae}.wfhead .btn{flex:none}
.h3s{font-size:12px;font-weight:400;color:#bfb79f;margin-left:6px}

.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.slot{border-radius:12px;padding:10px;background:#3a2a1c;border:1px solid #ffffff14;display:grid;gap:8px;justify-items:center;text-align:center;font-size:12.5px;color:#e5d9c0}
.string{display:flex;flex-direction:column;align-items:center;position:relative;height:96px}
.string:before{content:"";position:absolute;top:0;bottom:6px;left:50%;width:2px;background:var(--pinenut)}
.string svg{width:26px;height:19px;position:relative;margin-top:-1px}
.slot .btn{width:100%}

.rec{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center}
.rec .pic{width:54px;height:54px;border-radius:10px;background:var(--paper2);display:grid;place-items:center}
.rec .pic svg{width:46px;height:46px}
.rec .nm{font-family:var(--display);font-size:16.5px;line-height:1.2}
.ings{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.ings .ok{color:var(--good)} .ings .no{color:var(--poison)}
.price{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45}
.rec .side{display:grid;gap:4px;justify-items:end}
.have{font-size:11.5px;color:var(--ink2)}

.ord{display:grid;gap:8px}
.who{display:flex;gap:10px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#fff;flex:none}
.who .nm{font-family:var(--display);font-size:16px}
.who .q{font-size:13px;color:var(--ink2);line-height:1.45}
.want{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper2);border-radius:10px;padding:8px 10px}
.want .w{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.want svg{width:32px;height:32px;flex:none}
.want .off{font-family:var(--display);font-size:17px;color:var(--persimmon-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.ord.done{opacity:.55}
.sell{display:grid;grid-template-columns:36px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #2b26201a}
.sell:first-child{border-top:0}
.sell svg{width:34px;height:34px}
.sell .nm{font-size:14px;min-width:0}
.sell .nm small{display:block;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.empty{color:var(--ink2);font-size:13.5px;line-height:1.55;margin:0}

.up{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.up .nm{font-family:var(--display);font-size:16.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lv{display:inline-flex;gap:3px}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--paper2);border:1px solid #2b262033}
.lv i.on{background:var(--persimmon);border-color:var(--persimmon)}
.up .ds{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:3px}

/* stand / risk */
.kv{display:grid;gap:10px}
.kv .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px}
.kv .row b{font-family:var(--display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.grade{display:flex;height:14px;border-radius:7px;overflow:hidden}
.grade i{display:block;height:100%}
.legend{display:grid;gap:3px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}
.alert{background:#f6dcc7;color:#7a3410;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5}
.risks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slbox{margin-top:10px;display:block}.slbox .nm{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.sbar{position:relative;height:10px;border-radius:6px;background:#00000022;margin:8px 0 6px;overflow:hidden}.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#6a8ab0}.sbar i.nx{opacity:.45}
.risk{border-radius:12px;padding:10px;text-align:center;background:var(--paper);color:var(--ink)}
.risk small{display:block;font-size:12px;color:var(--ink2)}
.risk b{font-family:var(--display);font-weight:400;font-size:19px}
.risk.lo b{color:var(--good)} .risk.mid b{color:var(--warn)} .risk.hi b{color:var(--poison)}
.notes{display:grid;gap:8px}
.note{font-size:13px;line-height:1.55;border-left:3px solid var(--moss);padding:2px 0 2px 10px;color:var(--ink)}
.note small{display:block;color:var(--ink2);font-size:11.5px}

nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding-inline:max(0px,calc((100% - 860px)/2));background:#14251d;border-top:1px solid #ffffff14}
nav button{background:none;border:0;padding:9px 0 10px;display:grid;justify-items:center;gap:2px;color:#9fae98;font-family:var(--display);font-size:14px}
nav svg{width:24px;height:24px}
nav button[aria-current="true"]{color:var(--pinenut)}
nav .dot{position:relative}
nav .dot:after{content:"";position:absolute;top:-1px;right:-6px;width:7px;height:7px;border-radius:50%;background:var(--persimmon)}

/* stage (mini-game) */
#stage{position:fixed;inset:0;z-index:20;background:var(--pine);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sthead{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 16px;max-width:900px;width:100%;margin:0 auto;box-sizing:border-box}
.sthead .ttl{font-family:var(--display);font-size:20px;line-height:1.1;min-width:0}
.sthead .ttl small{display:block;font-family:var(--body);font-size:12px;color:#cfc6b0;margin-top:3px;line-height:1.4}
.timer{font-family:var(--display);font-size:26px;color:var(--pinenut);width:44px;text-align:center;font-variant-numeric:tabular-nums}
.quit{border:1px solid #ffffff30;background:#ffffff0d;border-radius:10px;padding:7px 10px;font-family:var(--display);font-size:14px}
.hud{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px;max-width:900px;width:100%;margin:0 auto;min-height:26px;box-sizing:border-box}
.hud span{font-size:12.5px;background:#ffffff14;border-radius:20px;padding:3px 9px;font-variant-numeric:tabular-nums}
.hud span.st{background:#e46f2740}
.arena{position:relative;flex:1;overflow:hidden;max-width:900px;width:100%;margin:0 auto;border-radius:18px 18px 0 0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.poleov{position:absolute;inset:0;width:100%;height:100%;z-index:61;pointer-events:none}.pbr svg{transition:transform .2s}.pbr.pfall{transition:top .8s ease-in,opacity .8s,rotate .8s;top:105%!important;opacity:0;rotate:70deg}
.wpad{position:absolute;inset:0;z-index:60;touch-action:none;cursor:crosshair}
.wtool{position:absolute;z-index:62;pointer-events:none;transform:translate(-30%,-75%);transform-origin:30% 75%}.wtool svg{width:100%;height:100%}
.wtool.sw.t0 svg,.wtool.sw.t1 svg{animation:wsw .22s ease-in-out infinite alternate;transform-origin:70% 95%}@keyframes wsw{from{rotate:-18deg}to{rotate:22deg}}
.wtool.t2 .disk{transform-origin:26px 74px}.wtool.sw.t2 .disk{animation:spin .15s linear infinite}@keyframes spin{to{rotate:360deg}}
.wtool.saw{transform:translate(-50%,-60%)}.wtool.saw.sw.s0 svg{animation:sawx .16s linear infinite alternate}.wtool.saw.sw.s1 svg{animation:buzzs .05s linear infinite alternate}@keyframes sawx{from{translate:-8px 0}to{translate:8px 0}}@keyframes buzzs{from{translate:-1px 1px}to{translate:1px -1px}}
.sbarw{position:absolute;z-index:58;width:46px;height:7px;border-radius:4px;background:#0006;transform:translate(-50%,0);pointer-events:none;overflow:hidden}.sbarw i{display:block;height:100%;width:0;background:#f2c230}
.dust{position:absolute;z-index:59;width:5px;height:5px;border-radius:50%;background:#e8c890;pointer-events:none;animation:clipf .6s ease-out forwards}
.deco.fall{transition:transform .6s ease-in,opacity .6s;transform:translate(-50%,-50%) rotate(84deg);opacity:0}
.jet{position:absolute;z-index:45;height:9px;margin-top:-4px;transform-origin:0 50%;border-radius:5px;pointer-events:none;background:repeating-linear-gradient(90deg,#bfe6ff 0 10px,#5aa8e8 10px 18px);opacity:.9;animation:jet .38s linear forwards}@keyframes jet{0%{clip-path:inset(0 100% 0 0)}30%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0);opacity:0}}
.wdrop{position:absolute;z-index:46;width:6px;height:6px;border-radius:50%;background:#8ccff5;pointer-events:none;animation:wdrop .5s ease-out forwards}@keyframes wdrop{to{translate:var(--dx) var(--dy);opacity:0;scale:.4}}
.wring{position:absolute;z-index:61;pointer-events:none;border:2px dashed #ffffffb0;border-radius:50%;transform:translate(-50%,-50%)}
.deco.tg{transition:transform .15s}.deco.tg.bent{transform:translate(-50%,-50%) rotate(14deg) scaleY(.85)}.deco.cutg{opacity:.9}
.clip{position:absolute;z-index:59;width:10px;height:4px;border-radius:2px;background:#7aa83a;pointer-events:none;animation:clipf .6s ease-out forwards}@keyframes clipf{to{translate:var(--dx) -50px;rotate:200deg;opacity:0}}
.bees{position:absolute;z-index:63;width:0;height:0;pointer-events:none}.bees i{position:absolute;width:22px;height:22px;left:-11px;top:-11px;animation:buzz var(--d) linear infinite}.bees i svg{width:100%;height:100%}@keyframes buzz{from{transform:rotate(var(--a)) translateX(34px) rotate(calc(-1*var(--a)))}to{transform:rotate(calc(var(--a) + 360deg)) translateX(34px) rotate(calc(-1*var(--a) - 360deg))}}
.sgear{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.sgear>div{flex:1;min-width:64px;text-align:center;background:#00000018;border-radius:10px;padding:6px 4px;opacity:.55;border:2px solid transparent}.sgear>div.on{opacity:1;border-color:#5a9a3a}.sgear svg{width:34px;height:34px;display:block;margin:0 auto 2px}.sgear small{display:block;font-size:11px}.sgear b{font-size:11px;color:#5a9a3a}.sgear>div:not(.on) b{color:#b8372b}
.sask{margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:#fff1c8;border:2px solid #e4a640}.sask b{display:block;font-size:16px;color:#5a3a08}.sask span{display:block;font-size:13px;margin-top:3px;color:#8a4a08}.sask em{font-style:normal;color:#d8262a;font-weight:700}
.satp{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}.satp span{font-size:11.5px;padding:1px 7px;border-radius:9px;background:#4f8a3a22;color:#2f5a22}.satp span.neg{background:#b8372b22;color:#8a1e16}
.spic{width:48px;height:48px;flex:none;border-radius:50%;background:#00000010;overflow:hidden}.spic svg{width:100%;height:100%}.tag{font-size:11px;padding:1px 6px;border-radius:8px;background:#00000014;font-weight:400}.tag.on{background:#4f8a3a;color:#fff}.card.staff.on{border:2px solid #4f8a3a}
.rbig{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}.rrow{display:flex;gap:12px;align-items:center;background:#00000008;border-radius:12px;padding:8px 10px}.rg{width:96px;flex:none}.rg svg{width:100%;display:block}.rrow b{display:block;font-size:17px}.rrow small{display:block;font-size:12.5px;opacity:.8}.rrow small.tip{opacity:.65;margin-top:2px}.lv-lo{color:#2f7a22}.lv-mid{color:#a8740a}.lv-hi{color:#c0301a}
.fcard{display:block;min-width:0;overflow:hidden}.fcrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}.fcrow b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:1px}
.fcin{display:flex;gap:8px;margin-top:10px;min-width:0}.fcin input{flex:1 1 0;min-width:0;width:0;font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid #00000030;background:#fff;color:var(--ink);text-transform:uppercase}.fcin .btn{flex:none;white-space:nowrap;padding:9px 12px}
.tutc{position:absolute;left:10px;top:120px;z-index:6;box-sizing:border-box;max-width:min(340px,calc(100% - 66px));background:#fffaf0ee;color:var(--ink);border-radius:12px;box-shadow:0 3px 10px #0003;border:2px solid #f2c230;overflow:hidden}
.tutl1{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:5px 9px;text-align:left;cursor:pointer}.tutl1 i{font-style:normal;font-size:11px;font-weight:700;background:#f2c230;color:#3a2a08;border-radius:8px;padding:1px 6px;flex:none}
.tutl1 b{font-family:var(--display);font-weight:400;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tutl1 span{font-size:11px;color:#8a6a2a;flex:none;text-decoration:underline}
.tutc p{margin:0;padding:0 10px 4px;font-size:12.5px;line-height:1.45}.tutf{display:flex;align-items:center;gap:8px;padding:2px 10px 8px}.tutf .tutbar{flex:1}.tutf button{border:0;background:none;color:#8a7a5a;font:inherit;font-size:11px;text-decoration:underline;padding:2px;flex:none}
.tutbar{height:5px;border-radius:3px;background:#0001;overflow:hidden}.tutbar i{display:block;height:100%;background:#f2c230}
.tutl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 10px}.tutl div{background:#00000008;border-radius:10px;padding:7px 9px;font-size:12px;line-height:1.35}.tutl b{display:block;font-family:var(--display);font-weight:400;font-size:15px}

  return {day:1,money:20000,sta:100,inv:{pyogo:2,gam:3},prod:{},rack:[null,null],orders:[],arrivals:4,heat:genHeat(3),camp:[],con:genCon(),up:{boots:0,logs:0,belt:0,tongs:0,rack:0,guide:0,saw:0,sickle:0,helmet:0,suit:0,goggle:0,gloves:0},careN:0,luck:0,earned:0,today:0,goalDone:false,

try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
const hot=window.claude&&window.claude.hot;

function migrateState(){(S.stands||[]).forEach(x=>{if(x.fn==='heal'&&x.fac&&!x.wmig){x.wmig=1;const old=['trail','deck','foot','tree','flower','herb','water','rock','green','center','kids'];if(x.loc!=='home'&&old.some(k=>x.fac[k])){x.fn='welfare';x.sp='none';delete x.mix;x.pest=0;x.burnt=[];x.young=[]}}if(x.fac){if(x.fac.center){x.fac.green=true;delete x.fac.center}if(x.fac.kids){x.fac.flower=true;delete x.fac.kids}}});if(S.stands)S.stands.forEach(x=>{if(x.fn==='eco'&&!x.lastCare)x.lastCare=S.day});if(S.builds)for(const k in S.builds)if(S.builds[k]===true)S.builds[k]=1;if(S.stand&&!S.stands){S.stands=[Object.assign(S.stand,{sp:S.stand.sp||'pine',loc:'home'})];delete S.stand}
  const d=fresh();for(const k in d)if(S[k]===undefined)S[k]=d[k];for(const k in d.up)if(S.up[k]===undefined)S.up[k]=0;S.orders=(S.orders||[]).filter(o=>!o.done)}
if(S.tut===undefined&&S.created)S.tut=(S.day>1||S.earned>0)?{done:true}:{i:0,on:true,did:{}};
if(S.careN===undefined)S.careN=Math.min(10,Math.floor((S.day||1)/4));

{const d=fresh();for(const k in d)if(S[k]===undefined)S[k]=d[k];for(const k in d.up)if(S.up[k]===undefined)S.up[k]=0;}

function bindStand(o){Object.defineProperty(o,'stand',{configurable:true,enumerable:false,get(){return o.stands[o.cur]||o.stands[0]},set(v){o.stands[o.cur||0]=v}})}

function sea(d){return (2+Math.floor(((d||S.day)-1)/7))%4}
function year(d){return Math.floor(((d||S.day)-1+14)/28)+1}
function seaDay(){return (S.day-1)%7+1}
function climL(){return Math.min(4,year()-1)}
function tempUp(){return (0.2+0.35*climL()).toFixed(1)}
function inSea(pid){return !SEA[pid]||SEA[pid].includes(sea())}
function gameOk(g){return !GSEA[g]||GSEA[g].includes(sea())}
function nextOk(g){if(!GSEA[g])return '';const s=sea();for(let k=1;k<4;k++)if(GSEA[g].includes((s+k)%4))return SEASONS[(s+k)%4];return ''}
function healthy(){const a=S.stands.filter(x=>!x.cut&&fnOf(x)!=='welfare');return a.length>0&&a.reduce((t,x)=>t+x.q,0)/a.length>=70}
const maxSta=()=>100+20*S.up.boots+homeBonus();
const inv=id=>S.inv[id]||0;

const canPay=need=>Object.entries(need).every(([k,v])=>have(k)>=v);

const needTxt=need=>Object.entries(need).map(([k,v])=>`<span class="${have(k)>=v?'ok':'no'}">${nameOf(k)} ${have(k)}/${v}</span>`).join('');

function newCust(){
  const pool=CUST.map((c,i)=>i).filter(i=>((i!==7&&i!==8)||S.day>=3)&&(CUST[i].n!=='계곡 피서객'||sea()===1));
  const good=pool.filter(i=>CUST[i].likes.some(p=>SEA[p]&&inSea(p)));
  const ci=Math.random()<.75&&good.length?pick(good):pick(pool),c=CUST[ci];
  const fit=c.likes.filter(p=>SEA[p]&&inSea(p)),okL=c.likes.filter(inSea);
  const pid=fit.length&&Math.random()<.8?pick(fit):okL.length?pick(okL):pick(c.likes);
  const r=RI[pid],qty=r.p<12000&&Math.random()<.45?2:1,bonus=SEA[pid]&&inSea(pid)?1.04:1;
  return {c:ci,pid,qty,q:prodLine(c,pid),off:Math.round(r.p*qty*rnd(1.08,1.12)*bonus/100)*100};
}
function genOrders(){return Array.from({length:Math.max(2,Math.round(6*rainF()))},newCust)}
function genHeat(n){const big=S&&sea()===3;return [...HEAT].sort(()=>Math.random()-.5).slice(0,n).map(h=>{const qty=(big?2:1)+ri(3);return {...h,qty,off:Math.round(RI[h.pid].p*qty*(big?1.12:1.1)/100)*100,done:false}})}
function genCamp(){if(!S||!bn('camp'))return [];const n=Math.round(Math.min(8,([2,4,3,1][sea()]+(gateOn()?2:0))*bn('camp'))*rainF());return Array.from({length:n},()=>{const pid=Math.random()<.8?'firewood':'pellet',qty=1+ri(2);return {n:pick(CAMPERS),pid,qty,off:Math.round(RI[pid].p*qty*1.1/100)*100,done:false}})}
function genCon(){return [...CONTRACTS].sort(()=>Math.random()-.5).slice(0,3).map(k=>{const qty=k.q[0]+ri(k.q[1]-k.q[0]+1);return {...k,qty,off:Math.round(RI[k.pid].p*qty*rnd(1.08,1.12)/1000)*1000,done:false}})}
const LEAVERS=[];
function serve(i,happy){const o=S.orders.splice(i,1)[0];LEAVERS.push({c:o.c,slot:Math.min(i,2),happy});if(S.arrivals>0){S.orders.push(newCust());S.arrivals--}}

const recBuilt=()=>BUILDS.reduce((t,b)=>t+(b.id==='gate'?0:bn(b.id)),0);
const builtCount=()=>recBuilt()+facCount();
const gateOn=()=>bn('gate')>0&&BUILDS.filter(b=>b.req).every(b=>b.req.every(r=>bn(r)>0));
const SEA_VIS=[1,1.3,1.2,.6];
function rainF(){return S&&S.wx==='폭우'?.3:S&&S.wx==='비'?.6:1}
const visitors=()=>Math.round(evtVisMul()*rainF()*satMult()*(BUILDS.reduce((t,b)=>t+(b.id==='gate'?0:bn(b.id)*b.vis),0)+(gateOn()?12:0)+facVis()+Math.floor((S.deco||[]).length/3))*SEA_VIS[sea()]);
const visitIncome=()=>Math.round(satMult()*(BUILDS.reduce((t,b)=>t+(b.id==='gate'?(gateOn()?b.inc:0):bn(b.id)*b.inc),0)*(.6+.4*(S.recSafe==null?70:S.recSafe)/100)+300*(S.deco||[]).length)*SEA_VIS[sea()]/100)*100;
const fireBan=()=>lvl(riskFire())[1]==='hi';
const banHtml=()=>`<div class="ban"><b>오늘은 장작 판매 금지</b>${riskFire(S.wx)>=riskFire(S.fc)?S.wx:S.fc+' 예보'} 때문에 산불 위험이 높아요. 그래도 장작을 팔면 손님이 야외에서 불을 피우다 산불이 날 위험이 올라가요.${S.badWood?` <b style="display:inline">오늘 몰래 판 장작 ${S.badWood}묶음 · 산불 위험 +${S.badWood*6}%p</b>`:''}</div>`;
const isBanned=pid=>pid==='firewood'&&fireBan();
function wetF(){const t=S.wx==='폭우'?.08:S.wx==='비'?.2:S.wx==='눈'?.3:1;return t*clamp(1.15-(S.soil||0)/90,.25,1)}
function riskFire(w){if(w===undefined)return Math.max(riskFire(S.wx),riskFire(S.fc));let p=(WXI[w]||WXI[S.fc]).fire;p*=1+.08*builtCount()+(gateOn()?.3:0);if(S.stands.some(x=>x.residue>0))p*=1.4;if(S.prev.tower)p*=.5;if(S.prev.patrol===S.day)p*=.35;if((S.prev.campaign||0)>=S.day)p*=.7;p+=.06*(S.badWood||0);p*=wetF();return Math.min(.9,p)}
const SOILG={'맑음':-12,'건조':-20,'폭염':-22,'강풍':-10,'눈':4,'비':22,'폭우':45};
function soilAfter(w){return clamp((S.soil||0)+(SOILG[w]||0)*((S.prev.drain||0)>=S.day&&SOILG[w]>0?.7:1),0,100)}
function soilBox(){const n=Math.round(S.soil||0),t=Math.round(soilAfter(S.fc)),c=t>=70?'#d8262a':t>=40?'#e4a640':'#5a9a3a';

factory(){

stand(){

  const st=S.stand,g=gradeP(st.q+bon(st));

    return `<div class="card up"><div style="min-width:0"><div class="nm">${c.n} ${need?'<span class="tag need">필요해요</span>':ok?'<span class="tag ok">괜찮아요</span>':''}</div><div class="ds">${c.ds}<br>시기: ${c.when}</div></div><button class="go" data-go="${k}" ${ok&&S.sta>=c.cost?'':'disabled'}>${ok?'시작':'시기 아님'}<small>체력 ${c.cost}</small></button></div>`}).join('');

    <div class="legend"><span style="--c:#c99a4a">고급 ${Math.round(g.hi*100)}% · 제재목·집성재·CLT감</span><span style="--c:#8a6440">중급 ${Math.round(g.mid*100)}% · MDF·팔레트감</span><span style="--c:#5a4a3a">저급 ${Math.round(g.lo*100)}% · 장작·펠릿감</span></div>
    ${st.pest?`<div class="alert">소나무재선충병 감염목 ${st.pest}그루! 매일 번지고 숲 건강도가 떨어져요. 방제가 급해요.</div>`:''}

  ${st.cut?`<div class="card up"><div><div class="nm">다시 심기 (재조림)</div><div class="ds">원하는 묘목을 골라 심어요. 새 숲이 1년생부터 다시 자라요.</div></div><button class="go" data-pick="${st.loc}">묘목<small>고르기</small></button></div>`
    :`<div class="card up"><div><div class="nm">벌채 (모두베기)</div><div class="ds">벌기령에 이른 숲을 베어 원목을 거둬요. 숲 건강도가 높을수록 고급재가 많이 나와요.</div></div><button class="go" data-go="harvest" ${st.age>=hA(st)&&S.sta>=25?'':'disabled'}>${st.age>=hA(st)?'벌채':`${hA(st)-st.age}년 남음`}<small>체력 25</small></button></div>`}
  </div>`;
},
build(){const tier=recTier(),cnt=recBuilt(),fc=facCount(),nx=tier<4?tierNeed(tier+1):0;
  return `<div class="sec">${back()}
  <h2>휴양림 터</h2><p class="sub">가공한 목제품으로 숲을 꾸며요. 같은 시설을 여러 채 지을 수 있고, 시설이 늘어 휴양림 등급이 오르면 유아숲체험원·산림레포츠·산림치유센터로 넓혀 갈 수 있어요. 사람이 많아지면 산불 위험도 커져요.</p>

  ${cnt&&!S.visiting?'<button class="btn ghost" data-bplmove style="width:100%;margin-top:10px">지어 둔 시설 옮기기</button>':''}
  ${staffHtml()}
  ${builtCount()?`<h3>안전관리</h3><div class="card kv"><div class="row"><span>휴양림 안전도</span><b>${S.recSafe==null?70:S.recSafe}</b></div><div class="bar"><i style="width:${S.recSafe==null?70:S.recSafe}%;background:linear-gradient(90deg,#b8372b,#c98a12 40%,#4f8a3a 75%)"></i></div><p class="empty" style="font-size:12.5px">안전도는 매일 조금씩 떨어지고, 낮을수록 이용료가 줄고 안전사고가 나기 쉬워요. 봄·여름엔 더 빨리 떨어져요.</p></div>
  <div class="card up"><div><div class="nm">${HZT[sea()]}</div><div class="ds">${['겨울을 지나 이용객이 늘기 전, 얼고 녹으며 상한 데크·난간·안내판을 점검해요.','계곡 물놀이 안전을 지키고 말벌집·뱀을 찾아 조치해요.','말벌·뱀·진드기가 많은 철이에요. 위험 요소를 찾아 알리고 조치해요.','결빙된 계단과 눈 쌓인 가지를 찾아 처리해요.'][sea()]} 하루 한 번.</div></div><button class="go" data-go="rsafe" ${S.sta>=10&&S.safeDay!==S.day?'':'disabled'}>${S.safeDay===S.day?'오늘 완료':'점검'}<small>체력 10</small></button></div>`:''}
  ${bn('camp')?`<h3>캠핑장 매점</h3>${fireBan()?banHtml():''}${S.camp.length?S.camp.map((k,i)=>{const r=RI[k.pid],h=prod(k.pid),ban=isBanned(k.pid);return `<div class="card rec"><div class="pic">${recIcon(r)}</div><div style="min-width:0"><div class="nm">${k.n}</div><div class="ings"><span class="${h>=k.qty?'ok':'no'}">${r.n} ${h}/${k.qty}</span></div><div class="price">${k.pid==='firewood'?'화로대에 피울 장작을 찾아요':'텐트 펠릿 난로용이에요'} · ${won(k.off)}원</div></div><div class="side"><button class="btn" data-camp="${i}" ${!k.done&&h>=k.qty?'':'disabled'}>${k.done?'판매 완료':ban?'금지 중 · 팔기':'팔기'}</button></div></div>`}).join(''):'<p class="sub">오늘 묵는 캠핑 손님이 없어요.</p>'}`:''}
  ${[1,2,3,4].map(t=>{const list=BUILDS.filter(b=>b.tier===t);if(!list.length)return '';const lock=t>tier;
    return `<h3>${t===1?'기본 시설':t===2?'2단계 · 가족 시설':t===3?'3단계 · 산림레포츠':'4단계 · 산림치유'}${lock?` <small style="font-family:var(--body);font-size:12px;color:#cfc6b0">시설 ${tierNeed(t)}채부터 열려요</small>`:''}</h3>`+list.map(b=>{const n=bn(b.id),mx=bmax(b),reqOk=!b.req||b.req.every(r=>bn(r)>0);const can=!lock&&n<mx&&reqOk&&canPay(b.need)&&S.money>=b.cost;

safety(){
  const f=riskFire(),s=riskSlide(),p=riskPest();const F=lvl(f),L=lvl(s),P=lvl(p);
  const status=x=>{if(x.type==='once')return S.prev[x.id]?'설치됨':'';if(x.type==='dur')return (S.prev[x.id]||0)>=S.day?`${S.prev[x.id]-S.day+1}일 남음`:'';return S.prev[x.id]===S.day?'오늘 완료':''};
  return `<div class="sec">${back()}
  <h2>산림 안전 초소</h2><p class="sub">날씨 예보 <b style="color:var(--pinenut)">${S.fc}</b>. 재해가 날 확률을 보고 미리 대비하세요. 하루를 마치면 그날 한 예방 활동이 반영돼요.</p>
  <div class="risks"><div class="risk ${F[1]}"><small>산불</small><b>${F[0]}</b></div><div class="risk ${L[1]}"><small>산사태</small><b>${L[0]}</b></div><div class="risk ${P[1]}"><small>병해충</small><b>${totalPest()?'발생 중':P[0]}</b></div></div>
  ${soilBox()}
  ${[['fire','산불 예방'],['slide','산사태 예방'],['pest','병해충 예방']].map(([rk,t])=>`<h3>${t}</h3>`+PREV.filter(x=>x.risk===rk).map(x=>{const st=status(x);const need=x.need||{};
    const can=!st&&S.money>=(x.cost||0)&&S.sta>=(x.sta||0)&&canPay(need);
    return `<div class="card up"><div style="min-width:0"><div class="nm">${x.n} ${st?`<span class="tag ok">${st}</span>`:''}</div><div class="ds">${x.ds}</div><div class="ings">${needTxt(need)}${x.cost?`<span class="${S.money>=x.cost?'ok':'no'}">${won(x.cost)}원</span>`:''}${x.sta?`<span class="${S.sta>=x.sta?'ok':'no'}">체력 ${x.sta}</span>`:''}</div></div><button class="btn" data-prev="${x.id}" ${can?'':'disabled'}>${st?'완료':'하기'}</button></div>`}).join('')).join('')}
  <h3>기후변화</h3>
  <div class="card kv"><div class="row"><span>평년보다 기온</span><b>+${tempUp()}℃</b></div>
    <div class="legend"><span style="--c:#c98a12">해가 갈수록 건조·폭우·폭염 날이 늘어요</span><span style="--c:#b8372b">여름이 길어져 병해충 매개충 활동이 늘어요 (+${climL()*20}%)</span><span style="--c:#6b3f22">가을 송이가 잘 안 나요 (-${climL()*12}%)</span><span style="--c:#4f8a3a">숲 건강도 70 이상이면 산사태·병해충 피해가 줄어요${healthy()?' · 지금 적용 중':''}</span></div>
    <p class="empty" style="font-size:12px">게임 속 수치예요. 실제 기후변화는 수십 년에 걸쳐 나타나요.</p></div>
  <div class="card"><p class="empty">지금까지 막아 낸 재해 · 산불 ${S.stats.fires}번, 산사태 ${S.stats.slides}번, 병해충 ${S.stats.pests}번</p></div>
  </div>`;
},

/* ================= actions ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.closest('#act')){const t=performance.now(),a=$('#act');if(t-Number(a.dataset.t||0)<450||t-CVD<600)return}
  const d=b.dataset;
  if(d.banok!==undefined){if(PENDB){const t=document.createElement('button');for(const k in PENDB)t.dataset[k]=PENDB[k];PENDB=null;closeModal();document.body.appendChild(t);FORCE=true;try{t.click()}finally{FORCE=false;t.remove()}}return}
  if(d.banno!==undefined){PENDB=null;closeModal();toast('잘 참았어요. 산불조심 기간엔 숲을 먼저 지켜요.');return}
  if(d.fn){const[loc,f]=d.fn.split(':');if(S.visiting)return;if(f==='back')pickFn(loc);else if(f==='timber')pickTimber(loc);else if(f==='eco'){ECOSEL=[];pickEco(loc)}else{HEALSEL=[];pickHeal(loc)}return}
  if(d.ecos){const[loc,k]=d.ecos.split(':');const i=ECOSEL.indexOf(k);if(i>=0)ECOSEL.splice(i,1);else if(ECOSEL.length<5)ECOSEL.push(k);pickEco(loc);return}
  if(d.heals){const[loc,k]=d.heals.split(':');const i=HEALSEL.indexOf(k);if(i>=0)HEALSEL.splice(i,1);else if(HEALSEL.length<5)HEALSEL.push(k);pickHeal(loc);return}
  if(d.ecoplant){if(ECOSEL.length<3)return;plantStand(d.ecoplant,'eco',[...ECOSEL],ECOSEL.reduce((t,k)=>t+ECO[k].cost,0));return}
  if(d.healplant){if(!HEALSEL.length)return;const m=[...HEALSEL].sort((a,b)=>(HEALSP[b]||0)-(HEALSP[a]||0));plantStand(d.healplant,'heal',m,m.reduce((t,k)=>t+(LSP[k]?LSP[k].price:(SPC[k]||ECO[k]).cost),0));return}
  if(d.nest){const st=S.stands[+d.nest];if(!st||(st.nest||0)>=6||!canPay({plank:1}))return;take({plank:1});st.nest=(st.nest||0)+1;st.lastCare=S.day;st.bio=clamp((st.bio||0)+4,0,100);save();publishVillage();renderKeep();toast('둥지상자를 달았어요. 생물다양성 +4');return}
  if(d.trailfix){const st=S.stands[+d.trailfix];if(!st||S.sta<8)return;S.sta-=8;st.needs.trail=false;save();renderKeep();toast('숲길을 정비했어요.');return}
  if(d.fac){const[si,k]=d.fac.split(':');const st=S.stands[+si],f=st&&facSet(st)?facSet(st)[k]:null;if(!f)return;if(fnOf(st)==='welfare'&&k!=='trail'){if(st.fac[k]||!canPay(f.need)||S.money<f.cost)return;wplStart(+si,k,'new');return}if(!st||st.fac[k]||!canPay(f.need)||S.money<f.cost)return;take(f.need);S.money-=f.cost;st.fac[k]=true;save();publishVillage();renderKeep();toast(`${f.n}을(를) 지었어요. ‘${PROG[k]}’ 프로그램을 운영할 수 있어요.`);return}
  if(d.replantb){const st=S.stands[+d.replantb],n=(st.burnt||[]).length;if(!n||S.money<n*1500)return;S.money-=n*1500;st.young=[...new Set([...(st.young||[]),...st.burnt])];st.burnt=[];save();publishVillage();renderKeep();toast(`산불 피해지 ${n}그루 자리에 묘목을 심었어요.`);return}
  if(d.zoom){setZoom(Number(d.zoom));return}
  if(d.cell&&!S.visiting){const[r,cc]=d.cell.split(',').map(Number),k=roomAt(r,cc);
    if(homeSel&&homeSel.id){if(k<0&&cellOk(homeSel.id,r)&&(S.furn[homeSel.id]||0)>0){S.room.push({id:homeSel.id,r,c:cc});S.furn[homeSel.id]--;toast(`${FURN[homeSel.id].n}을(를) 놓았어요.`);homeSel=null;save();publishVillage()}else if(k>=0){homeSel={k}}else toast(FURN[homeSel.id].wall?'벽 줄(맨 윗줄)에 걸어요.':'바닥 칸에 놓아요.');renderKeep();return}
    if(homeSel&&homeSel.k!==undefined&&S.room[homeSel.k]){const it=S.room[homeSel.k];if(k<0&&cellOk(it.id,r)){it.r=r;it.c=cc;homeSel=null;save();publishVillage()}else if(k>=0)homeSel=k===homeSel.k?null:{k};else toast(FURN[it.id].wall?'벽 줄(맨 윗줄)에 걸어요.':'바닥 칸에 놓아요.');renderKeep();return}
    if(k>=0){homeSel={k};renderKeep()}return}
  if(d.fsel){homeSel=homeSel&&homeSel.id===d.fsel?null:{id:d.fsel};const m=$('#main');render();m.scrollTop=0;return}
  if(d.fcancel!==undefined){homeSel=null;renderKeep();return}
  if(d.fput!==undefined){if(S.visiting)return;const it=homeSel&&S.room[homeSel.k];if(it){S.room.splice(homeSel.k,1);S.furn[it.id]=(S.furn[it.id]||0)+1;save();publishVillage();toast(`${FURN[it.id].n}을(를) 치웠어요.`)}homeSel=null;renderKeep();return}
  if(d.craft){if(S.visiting)return;const f=FURN[d.craft],n=qtyOf('f:'+d.craft,f.need);if(!n)return;for(let i=0;i<n;i++)take(f.need);S.furn[d.craft]=(S.furn[d.craft]||0)+n;QTY['f:'+d.craft]=1;save();toast(`${f.n} ${n}개를 만들었어요. 위 ‘내 가구’에서 놓을 수 있어요.`);renderKeep();return}
  if(d.sow!==undefined){if(S.visiting)return;sowModal(+d.sow);return}
  if(d.sowsp){if(S.visiting)return;const[i,sp]=d.sowsp.split(':');const L=LSP[sp];if(S.money<L.cost||S.beds[+i])return;S.money-=L.cost;S.beds[+i]={sp,g:0};save();publishVillage();closeModal();renderKeep();toast(`${L.n} 씨앗을 뿌렸어요. ${L.grow}일 뒤에 묘목이 돼요.${sea()===3?' 겨울엔 쉬었다가 봄부터 자라요.':''}`);return}
  if(d.lift!==undefined){if(S.visiting)return;const b=S.beds[+d.lift];if(!b||b.g<LSP[b.sp].grow)return;S.sapl[b.sp]=(S.sapl[b.sp]||0)+1;S.beds[+d.lift]=null;save();publishVillage();renderKeep();toast(`${LSP[b.sp].n} 묘목을 캤어요.`);return}
  if(d.bedx!==undefined){if(S.visiting||S.money<20000||S.beds.length>=8)return;S.money-=20000;S.beds.push(null);save();publishVillage();renderKeep();toast('이랑을 하나 늘렸어요.');return}
  if(d.sellsap){if(S.visiting)return;const sp=d.sellsap;if(!(S.sapl[sp]>0))return;S.sapl[sp]--;earn(LSP[sp].price);renderKeep();toast(`조경업체에 ${LSP[sp].n} 묘목을 팔았어요. +${won(LSP[sp].price)}원`);return}
  if(d.plantl){if(S.visiting||!(S.sapl[d.plantl]>0))return;placing=d.plantl;homeSel=null;tab='forest';render();toast('마을에서 심을 곳을 눌러요.');return}
  if(d.plcancel!==undefined){placing=null;const pb=$('#plbar');pb&&pb.remove();return}
  if(d.dig!==undefined){if(S.visiting)return;const k=+d.dig,dd=S.deco[k];if(!dd)return;S.deco.splice(k,1);S.sapl[dd.sp]=(S.sapl[dd.sp]||0)+1;save();publishVillage();actKey='';toast(`${LSP[dd.sp].n}을(를) 캐서 묘목으로 챙겼어요. 우리 집에서 다시 심을 수 있어요.`);return}
  if(d.crs){crKeep();CR.shirt=d.crs;createChar();return}
  if(d.crh){crKeep();CR.hat=d.crh;createChar();return}
  if(d.crr){crKeep();CR.hair=d.crr;createChar();return}
  if(d.crgo!==undefined){crDone();return}

function nbrs(i){const c=i%5,r=Math.floor(i/5);return [[c-1,r],[c+1,r],[c,r-1],[c,r+1]].filter(([a,b])=>a>=0&&a<5&&b>=0&&b<4).map(([a,b])=>b*5+a)}

  if(!st){S.fire={loc:null,cells:[]};return null}st.burnt=st.burnt||[];const free=[...Array(20).keys()].filter(i=>!st.burnt.includes(i));const n=(S.prev.tower?2:4)+(st.residue?2:0)+(S.wx==='강풍'?1:0);
  const cells=[];while(cells.length<Math.min(n,free.length)){const i=pick(free);if(!cells.includes(i))cells.push(i)}S.fire={loc:st.loc,cells};return st}

  else{S.money=Math.max(0,S.money-20000);L.push('<b>밤새 산불이 번졌어요!</b> 마을 숲이 타서 복구비 20,000원이 들었어요.')}

function myCode(){if(!S.fcode){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';S.fcode=Array.from({length:6},()=>A[ri(A.length)]).join('');save()}return S.fcode}
function isFriend(id){return FR.mine.includes(id)&&!!FR.in[id]}
async function loadFriends(){if(!DB||!UID)return;try{const me=await DB.doc('friends/'+UID).get();FR.mine=me.exists&&Array.isArray((me.data()||{}).list)?me.data().list.filter(x=>typeof x==='string').slice(0,100):[];
  const qs=await DB.collection('friends').where('list','array-contains',UID).limit(200).get();FR.in={};qs.docs.forEach(d=>{if(d.id!==UID)FR.in[d.id]=true});FR.ready=true}catch(e){}}
async function setFriends(list){if(!DB||!UID)return false;try{await DB.doc('friends/'+UID).set({list:[...new Set(list)].slice(0,100),t:Date.now()});FR.mine=[...new Set(list)];return true}catch(e){return false}}
async function addFriend(id){if(!id||id===UID||FR.mine.includes(id))return;if(await setFriends([...FR.mine,id]))toast(FR.in[id]?'친구가 되었어요! 이제 서로의 마을에 놀러 갈 수 있어요.':'친구 신청을 보냈어요. 상대가 수락하면 친구가 돼요.');else toast('지금은 친구 신청을 보낼 수 없어요.');loadNeighbors()}
async function delFriend(id){if(await setFriends(FR.mine.filter(x=>x!==id)))toast('친구를 끊었어요.');loadNeighbors()}
async function addByCode(code){code=String(code||'').trim().toUpperCase();if(code.length<4){toast('친구 코드를 확인해 주세요.');return}if(code===myCode()){toast('내 코드예요. 친구의 코드를 넣어 주세요.');return}
  try{const qs=await DB.collection('villages').where('code','==',code).limit(1).get();if(!qs.docs.length){toast('그 코드의 마을을 찾지 못했어요.');return}const d=qs.docs[0];NB[d.id]=d.data();addFriend(d.id)}catch(e){toast('지금은 찾을 수 없어요. 잠시 뒤 다시 해 주세요.')}}
// shelf: S.shelf={pid:qty}; price = RI[pid].p
function shelfQ(id){return (S.shelf&&S.shelf[id])||0}

async function soldSince(host,since){try{const qs=await DB.collection('buys').where('sellers','array-contains',host).limit(200).get();const m={};qs.docs.forEach(d=>{const L=(d.data()||{}).list;if(Array.isArray(L))L.forEach(x=>{if(x&&x.s===host&&Number(x.t)>since&&RI[x.pid])m[x.pid]=(m[x.pid]||0)+clamp(Number(x.q)||0,0,99)})});return m}catch(e){return null}}

function drawFM(first){const html=`<h2>${esc(S.vname)} 친구 장터</h2><p class="sub" style="margin:0 0 10px">${esc(S.me.name)}님이 손수 만든 물건이에요. 정가로 살 수 있고, 산 물건은 우리 마을 창고로 가요. 내 돈 ${won(ME.money)}원</p>

async function friendBuy(pid){if(FBUSY||!FM||!S.visiting||!DB)return;const r=RI[pid],it=FM.items.find(x=>x.id===pid);if(!r||!it)return;if(ME.money<r.p){toast('돈이 모자라요.');return}

    const ref=DB.doc('buys/'+UID);const cur=await ref.get();const body=cur.exists?cur.data()||{}:{};let list=Array.isArray(body.list)?body.list.slice(-59):[];
    const e={id:UID.slice(-6)+Date.now().toString(36)+ri(1000),s:FM.host,pid,q:1,p:r.p,t:Date.now()};list.push(e);
    await ref.set({name:ME.me.name,list,sellers:[...new Set(list.map(x=>x.s))],t:Date.now()});
    ME.money-=r.p;S.money=ME.money;ME.prod[pid]=(ME.prod[pid]||0)+1;FM.sold[pid]=(FM.sold[pid]||0)+1;try{localStorage.setItem(KEY,JSON.stringify(ME))}catch(_){}
    if(DB&&UID)DB.doc('data/users/'+UID+'/save').set({json:JSON.stringify(ME),t:Date.now()}).catch(()=>{});
    renderTop();toast(`${r.n}을(를) 샀어요! 우리 마을 창고로 보냈어요.`);drawFM()}catch(e){toast('지금은 살 수 없어요. 잠시 뒤 다시 해 주세요.')}finally{FBUSY=false}}
async function checkSales(){if(!DB||!UID||S.visiting||!S.created)return;try{const qs=await DB.collection('buys').where('sellers','array-contains',UID).limit(200).get();
  S.soldIds=S.soldIds||[];const seen=new Set(S.soldIds);let total=0,cnt=0;S.shelf=S.shelf||{};S.salesLog=S.salesLog||[];
  qs.docs.forEach(d=>{const v=d.data()||{},L=Array.isArray(v.list)?v.list:[];L.forEach(x=>{if(!x||x.s!==UID||seen.has(String(x.id))||!RI[x.pid])return;const q=clamp(Math.floor(Number(x.q)||0),1,9);    seen.add(String(x.id));S.soldIds.push(String(x.id));const have=shelfQ(x.pid);S.shelf[x.pid]=Math.max(0,have-q);const m=RI[x.pid].p*q;S.money+=m;S.earned+=m;total+=m;cnt+=q;S.salesLog.push({who:String(v.name||'친구').slice(0,8),n:RI[x.pid].n,q,m,t:Number(x.t)||Date.now()})})});
  S.soldIds=S.soldIds.slice(-400);S.salesLog=S.salesLog.slice(-30);
  if(cnt){save();publishVillage();renderTop();toast(`친구 장터에서 물건 ${cnt}개가 팔렸어요! +${won(total)}원`);if(tab==='market')renderKeep()}}catch(e){}}
setInterval(()=>{if(!document.hidden)checkSales()},60000);

      <div class="want"><div class="w">시설 ${nb}개 · ♥ ${hearts[d.id]||0}${v.shelf&&Object.keys(v.shelf).length?' · 장터 진열 중':''}</div>

      :`<div class="card"><p class="empty">아직 다른 마을이 없어요. 이 링크를 친구에게 공유하면 친구가 만든 마을이 여기 나타나요.</p></div>`);

    const mine=(GB[UID]||[]).sort((a,b)=>b.t-a.t);S.gbSeen=Date.now();save();
    gm.innerHTML=mine.length?mine.map(m=>`<div class="note">${m.heart?'<b style="color:#c8432b">♥</b> ':''}${esc(m.m||'하트를 보냈어요')}<small>${esc(m.from)} · ${m.t?new Date(m.t).toLocaleDateString('ko-KR'):''}</small></div>`).join(''):'<p class="empty">아직 방명록이 없어요. 이웃이 놀러 오면 여기 남겨져요.</p>';
  }catch(e){el.innerHTML='<div class="card"><p class="empty">이웃 마을을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p></div>'}}

function care(type,good,bad,target){const st=S.stand,c=CARE[type],was=st.needs[type];

function grid(cols,rows,y0,y1){const out=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)out.push([(c+.5)/cols*100+(r%2?4:-4),y0+(r+.5)/rows*(y1-y0)]);return out}

    if(!best){toast('지어 둔 시설을 눌러 주세요.');return}BPL.id=best.id;BPL.k=best.k;BPL.pos=null;BPL.from=[...BSLOT[best.id][best.k]];bplDraw();toast(`${BUILDS.find(q=>q.id===best.id).n}을(를) 골랐어요. 옮길 곳을 눌러요.`);return}
  BPL.pos=[Math.round(x),Math.round(y)];BPL.err=bplCheck(BPL.id,x,y,BPL.mode==='move'?BPL.k:-1);bplDraw()}

weed:{name:'풀베기',cat:1,sc:'care',cost:10,time:20,noAv:true,howF:()=>`손가락으로 풀 위를 문질러 베요. ${['손낫은 두 번씩 문질러야 베여요.','조선낫은 한 번에 넓게 베요.','예초기는 아주 넓게 베지만, 어린나무 가까이에선 조심!'][S.up.sickle||0]} 하얀 말뚝 옆 어린나무는 피해요.`,
 init(api){const A=api.A,tool=S.up.sickle||0,U=api.sz(1),W=A.clientWidth,H=A.clientHeight,R=[.075,.1,.14][tool]*U,hp0=tool?1:2;
  let cut=0,bad=0,last=null,drag=false,hzDone=false;const seeds=grid(3,2,20,90).map(([x,y])=>({x,y,px:x/100*W,py:y/100*H,t:0}));
  const upd=()=>api.stat(`벤 풀 ${Math.round(cut/TF.length*100)}% · 실수 ${bad}`);
  seeds.forEach(s=>{s.el=api.deco(SP.seedling2(),s.x,s.y,api.sz(.2))});
  const TF=[];const add=(x,y)=>{x=clamp(x,4,96);y=clamp(y,10,96);if(seeds.some(s=>Math.hypot((s.x-x)*W/100,(s.y-y)*H/100)<U*.075))return;const el=api.deco(SP.tallgrass(Math.random()<.5),x,y,api.sz(rnd(.13,.18)));el.classList.add('tg');TF.push({x,y,px:x/100*W,py:y/100*H,hp:hp0,el})};
  seeds.forEach(s=>{for(let k=0;k<5;k++){const a=k/5*6.28+rnd(-.3,.3),d=rnd(10,13);add(s.x+Math.cos(a)*d,s.y+Math.sin(a)*d*.8)}});
  for(let k=0;k<60;k++)add(rnd(4,96),rnd(10,96));
  TF.sort((a,b)=>a.y-b.y).forEach((t,i)=>t.el.style.zIndex=1+Math.round(t.y/2));seeds.forEach(s=>s.el.style.zIndex=55);
  const sea0=sea();const far=TF.filter(t=>seeds.every(s=>Math.hypot(t.px-s.px,t.py-s.py)>U*.12));
  const nest=sea0<3&&Math.random()<.75?pick(far):null;if(nest)nest.nest=true;
  const stones=tool===2?far.filter(t=>!t.nest).sort(()=>Math.random()-.5).slice(0,2):[];stones.forEach(t=>t.stone=true);
  upd();
  const pad=document.createElement('div');pad.className='wpad';A.appendChild(pad);
  const tl=document.createElement('div');tl.className='wtool t'+tool;tl.style.width=tl.style.height=Math.round(U*(tool===2?.2:.15))+'px';tl.innerHTML=SP.wtool(tool);tl.hidden=true;A.appendChild(tl);
  const ring=document.createElement('div');ring.className='wring';ring.style.width=ring.style.height=R*2+'px';ring.hidden=true;A.appendChild(ring);
  function bees(t){const sw=document.createElement('div');sw.className='bees';sw.style.left=t.x+'%';sw.style.top=t.y+'%';sw.innerHTML=Array.from({length:6},(_,i)=>`<i style="--a:${i*60}deg;--d:${.6+i*.08}s">${SP.bee()}</i>`).join('');A.appendChild(sw);setTimeout(()=>sw.remove(),2600);
    t.el.innerHTML=SP.wnest();
    if(S.up.suit){api.msg('땅벌집이에요! 안전복·각반 덕분에 쏘이지 않았어요. 벌집 주변은 표시해 두고 피해서 베요.')}else{api.hurt(10);api.float(t.x,t.y-8,'따끔! 체력 −10',true);api.msg('땅벌에 쏘였어요! 긴 옷과 각반을 갖추고, 풀숲을 막대로 먼저 두드려 살펴요.',true)}}
  function hitAt(x,y){for(const t of TF){if(t.hp<=0)continue;const d=Math.hypot(t.px-x,t.py-y);if(d>R)continue;
      if(t.stone){t.stone=false;if(S.up.goggle){api.float(t.x,t.y-6,'탁! 돌이 튀었어요')}else{api.hurt(8);api.float(t.x,t.y-6,'돌이 튀었어요! −8',true);api.msg('예초기 날에 돌이 튀었어요. 보안경과 안면보호구를 꼭 써요.',true)}}
      t.hp--;if(t.hp>0){t.el.classList.add('bent');continue}
      t.el.classList.remove('bent');t.el.classList.add('cutg');t.el.innerHTML=SP.stubble();cut++;
      if(Math.random()<.35){const c=document.createElement('div');c.className='clip';c.style.left=t.x+'%';c.style.top=t.y+'%';c.style.setProperty('--dx',rnd(-40,40)+'px');A.appendChild(c);setTimeout(()=>c.remove(),600)}
      if(t.nest&&!hzDone){hzDone=true;bees(t)}}
    const sr=R*(tool===2?.75:.5);
    for(const s of seeds){if(Math.hypot(s.px-x,s.py-y)>sr||performance.now()-s.t<900)continue;s.t=performance.now();bad++;s.el.classList.remove('wig');void s.el.offsetWidth;s.el.classList.add('wig');api.float(s.x,s.y-8,'어린나무!',true);
      api.msg(tool===2?'예초기 날이 어린나무를 쳤어요! 말뚝 근처에선 날을 천천히 비켜 가요.':'어린나무를 벨 뻔했어요. 하얀 말뚝 옆은 피해서 문질러요.',true)}
    upd()}
  function pos(e){const r=pad.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  function show(x,y){tl.hidden=false;tl.style.left=x+'px';tl.style.top=y+'px';if(tool===2){ring.hidden=false;ring.style.left=x+'px';ring.style.top=y+'px'}}
  pad.addEventListener('pointerdown',e=>{if(api.over)return;e.preventDefault();drag=true;try{pad.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pos(e);last=[x,y];show(x,y);tl.classList.add('sw')});
  pad.addEventListener('pointermove',e=>{if(!drag||api.over)return;e.preventDefault();const[x,y]=pos(e);show(x,y);const[lx,ly]=last,d=Math.hypot(x-lx,y-ly);if(d<3)return;
    const n=Math.max(1,Math.ceil(d/(R*.5)));for(let i=1;i<=n;i++)hitAt(lx+(x-lx)*i/n,ly+(y-ly)*i/n);last=[x,y]});
  const up=()=>{drag=false;tl.classList.remove('sw')};pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
  return {end(){const f=cut/TF.length;return care('weed',Math.round(f*14),bad,12)+`<br>풀 ${Math.round(f*100)}%를 베었어요 (${['손낫','조선낫','예초기'][tool]} 사용).`}}}},
vine:{name:'덩굴제거',cat:1,sc:'care',cost:10,time:20,noAv:true,how:'나무를 감은 칡덩굴을 손가락으로 아래로 쭉 끌어당겨 걷어 내요(두 번). 덩굴은 점점 자라서, 다 자라면 나무가 휘어 버려요!',
 init(api){let cut=0,bent=0,t=0,spawned=0;const pos=grid(3,2,22,88);const upd=()=>api.stat(`걷은 덩굴 ${cut} · 휜 나무 ${bent}`);upd();
  pos.forEach(([x,y])=>api.deco(SP.ctree('good'),x,y,api.sz(.26)));
  const busy=new Set(),V=[];
  function spawn(){const free=pos.map((p,i)=>i).filter(i=>!busy.has(i));if(!free.length)return;const i=pick(free);busy.add(i);spawned++;const[x,y]=pos[i];
    const v={i,x,y,hp:2,g:.12,el:api.spr(SP.vine(),x,y+4,api.sz(.24)),sy:null,gone:false};v.el.style.touchAction='none';v.sv=v.el.querySelector('svg');v.sv.style.clipPath='inset(88% 0 0 0)';V.push(v);
    v.el.addEventListener('pointerdown',e=>{if(api.over||v.gone)return;e.preventDefault();v.sy=e.clientY;try{v.el.setPointerCapture(e.pointerId)}catch(_){}});
    v.el.addEventListener('pointermove',e=>{if(v.sy===null||v.gone)return;const dy=Math.max(0,e.clientY-v.sy);v.el.style.translate=`0 ${Math.min(40,dy*.5)}px`});
    const rel=e=>{if(v.sy===null||v.gone)return;const dy=e.clientY-v.sy;v.sy=null;v.el.style.translate='';
      if(dy>api.sz(.12)){v.hp--;v.g=Math.max(.1,v.g-.3);api.float(x,y,v.hp>0?'쭉—':'뚝!');if(v.hp<=0){v.gone=true;v.el.remove();busy.delete(i);cut++;api.add('chikjul',1,x,y);if(Math.random()<.45)api.add('chik',1,x,y+6);upd()}}
      else{v.el.classList.remove('wig');void v.el.offsetWidth;v.el.classList.add('wig');if(!api.over&&!v.hint){v.hint=1;api.msg('톡톡 눌러선 안 끊겨요. 덩굴을 잡고 아래로 쭉 끌어당겨요!')}}};
    v.el.addEventListener('pointerup',rel);v.el.addEventListener('pointercancel',rel)}
  for(let k=0;k<3;k++)spawn();
  return {tick(dt){t-=dt;if(t<=0&&spawned<16){t=rnd(.9,1.4);spawn()}
      for(const v of V){if(v.gone)continue;v.g+=dt/7.5;v.sv.style.clipPath=`inset(${Math.max(0,(1-v.g)*100).toFixed(1)}% 0 0 0)`;
        if(v.g>=1){v.gone=true;bent++;v.el.classList.add('done');v.el.style.filter='saturate(.6)';api.float(v.x,v.y-8,'나무가 휘었어요',true);if(bent===1)api.msg('덩굴이 다 자라 나무를 휘감았어요. 자라기 전에 빨리 걷어 내요!',true);setTimeout(()=>{v.el.remove();busy.delete(v.i)},1500);upd()}}},
   end(){return care('vine',cut,bent,10)}}}},
prune:{name:'가지치기',cat:1,sc:'care',cost:12,time:30,noTime:true,how:'기다란 고지톱을 곁가지에 대고 위아래든 좌우든 쓱싹쓱싹 문질러 잘라요. 점선 아래쪽 곁가지만 자르고, 위쪽 가지는 잎을 키우니 남겨 둬요. 아래 가지를 다 자르면 끝나요.',
 init(api){const A=api.A;let cut=0,bad=0;const xs=[16,38,62,84];const W=A.clientWidth,H=A.clientHeight,bs=Math.min(api.sz(.12),W*.085);
  const line=document.createElement('div');line.className='cutline';line.style.top='44%';line.innerHTML='<span>여기 아래만 자르기</span>';A.appendChild(line);
  xs.forEach(x=>{const tr=api.deco(`<svg viewBox="0 0 20 100" preserveAspectRatio="none"><rect x="7" y="0" width="6" height="100" fill="#6b4a2e"/></svg>`,x,58,14,H*.8);tr.style.top='58%';api.deco(SP.ctree('good'),x,20,api.sz(.24))});
  const B=[];xs.forEach((x,ti)=>{[26,31,36,41,50,55,60,65,70,75,80,85].map(v=>v+(ti%2?2.5:0)).forEach((y,k)=>{const l=(k+ti)%2,low=y>46,bx=x+(l?-1:1)*(bs/W*50);
    const el=api.deco(leafBranch(low),bx,y,bs,bs*.5);el.style.zIndex=12;if(l)el.firstElementChild.style.transform='scaleX(-1)';el.classList.add('pbr');
    const bar=document.createElement('div');bar.className='sbarw';bar.style.left=bx+'%';bar.style.top=`calc(${y}% + ${bs*.22}px)`;bar.innerHTML='<i></i>';bar.hidden=true;A.appendChild(bar);
    B.push({x:bx,y,px:bx/100*W,py:y/100*H,low,el,bar,p:0,done:false,lock:0})})});
  const total=B.filter(b=>b.low).length;const upd=()=>api.stat(`자른 가지 ${cut}/${total}${bad?' · 실수 '+bad:''}`);upd();
  const pad=document.createElement('div');pad.className='wpad';A.appendChild(pad);
  const ov=document.createElementNS('http://www.w3.org/2000/svg','svg');ov.setAttribute('class','poleov');ov.setAttribute('viewBox',`0 0 ${W} ${H}`);A.appendChild(ov);
  const drawPole=(x,y,saw)=>{const bx=W*.5,by=H+30,a=Math.atan2(y-by,x-bx),d=Math.hypot(x-bx,y-by),cx=Math.cos(a),sy=Math.sin(a),nx=-sy,ny=cx;
    const hx=x-cx*6,hy=y-sy*6,bl=26,wob=saw?Math.sin(performance.now()/40)*3:0;
    ov.innerHTML=`<line x1="${bx}" y1="${by}" x2="${hx}" y2="${hy}" stroke="#8a6a40" stroke-width="7" stroke-linecap="round"/><line x1="${bx}" y1="${by}" x2="${hx}" y2="${hy}" stroke="#b08a58" stroke-width="2.4" stroke-linecap="round"/>`+
      [.25,.5,.75].map(t=>`<circle cx="${bx+(hx-bx)*t}" cy="${by+(hy-by)*t}" r="4.4" fill="#5a5a5a"/>`).join('')+
      `<path d="M${hx} ${hy}Q${hx+cx*14+nx*(10+wob)} ${hy+sy*14+ny*(10+wob)} ${hx+cx*bl+nx*(4+wob)} ${hy+sy*bl+ny*(4+wob)}L${hx+cx*bl-nx*3} ${hy+sy*bl-ny*3}Q${hx+cx*12+nx*2} ${hy+sy*12+ny*2} ${hx-nx*4} ${hy-ny*4}Z" fill="#c8ccd2" stroke="#6a6e76" stroke-width="1.4"/>`+
      Array.from({length:6},(_,k)=>{const t=.2+k*.13,qx=hx+cx*bl*t-nx*(3-6*t),qy=hy+sy*bl*t-ny*(3-6*t);return `<path d="M${qx} ${qy}l${-nx*3+cx*2} ${-ny*3+sy*2}l${cx*2} ${sy*2}" stroke="#6a6e76" stroke-width="1" fill="none"/>`}).join('')};
  drawPole(W*.5,H*.6,false);
  const at=(x,y,k)=>{k=k||1;let best=null,bd=1e9;for(const b of B){if(b.done)continue;const dx=Math.abs(x-b.px),dy=Math.abs(y-b.py);if(dx<bs*.6*k&&dy<H*.03*k){const d=dx+dy*1.5;if(d<bd){bd=d;best=b}}}return best};
  let last=null,dir=0,acc=0,cur=null,word=0;
  const pos=e=>{const r=pad.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  pad.addEventListener('pointerdown',e=>{if(api.over)return;e.preventDefault();try{pad.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pos(e);last=[x,y];dir=0;acc=0;cur=at(x,y);drawPole(x,y,!!cur)});
  pad.addEventListener('pointermove',e=>{const[x,y]=pos(e);if(!last){drawPole(x,y,false);return}e.preventDefault();const mv=Math.hypot(x-last[0],y-last[1]);last=[x,y];
    if(!(cur&&!cur.done&&at(x,y,1.5)===cur))cur=at(x,y);drawPole(x,y,!!cur);if(!cur||performance.now()<cur.lock||mv<.5)return;
    cur.p+=mv/(bs*1.3);acc+=mv;if(acc>bs*.28){acc=0;word^=1;api.float(cur.x+(word?-5:5),cur.y-6,word?'쓱':'싹');const dd=document.createElement('div');dd.className='dust';dd.style.left=cur.x+'%';dd.style.top=cur.y+'%';dd.style.setProperty('--dx',rnd(-20,20)+'px');A.appendChild(dd);setTimeout(()=>dd.remove(),600)}
    cur.bar.hidden=false;cur.bar.firstChild.style.width=Math.min(100,cur.p*100)+'%';
    if(cur.p>=1){const b2=cur;b2.done=true;b2.bar.remove();b2.el.classList.add('pfall');setTimeout(()=>b2.el.remove(),800);cur=null;
      if(!b2.low){bad++;api.float(b2.x,b2.y-8,'앗!',true);api.msg('위쪽 가지를 잘랐어요! 위쪽 가지는 잎을 키워 나무를 굵게 하니 남겨 둬요.',true);upd();return}
      cut++;api.float(b2.x,b2.y-8,'뚝!');upd();
      if(cut>=total){api.msg('곁가지를 깔끔하게 다 잘랐어요! 옹이 없는 곧은 목재로 자랄 거예요.');api.soon(1.8)}}});
  const up=()=>{last=null;cur=null};pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
  return {end(){return care('prune',cut,bad,total)}}}},
thin:{name:'솎아베기',cat:1,sc:'care',cost:15,time:24,noTime:true,noAv:true,howF:()=>`굽은 나무·쌍가지 나무·가늘고 약한 나무(열세목)만 골라 밑동을 베요. ${['손톱으로 밑동을 좌우로 쓱싹쓱싹 문질러요.','엔진톱을 밑동에 대고 문질러요.','굴삭기 집게톱으로 밑동을 한 번 쓸어요.','하베스터로 나무를 톡 누르면 한 번에 베어요.'][Math.min(3,S.up.saw||0)]} 곧고 굵은 우량목은 남겨요! 시간 제한 없이 5그루를 다 솎으면 끝나요.`,
 init(api){let cut=0,bad=0;const pos=grid(4,3,14,86);const weak=new Set();while(weak.size<5)weak.add(ri(pos.length));const upd=()=>api.stat(`솎은 나무 ${cut}/5 · 실수 ${bad}`);upd();
  const kinds=['bent','fork','thin','bent','fork'];let wi=0;
  const F=sawField(api,{strokes:7,rub:api.sz(1)*1.1,trees:pos.map(([x,y],i)=>{const w=weak.has(i);return {x,y,s:w?.22:rnd(.23,.26),ok:w,svg:w?SP.ctree2(kinds[wi++%5]):SP.ctree('good')}}),
    bad(t){bad++;api.float(t.x,t.y-8,'우량목!',true);api.msg('곧고 굵은 우량목이에요! 이 나무를 키워야 좋은 목재가 나와요.',true);upd()},
    cut(t,lv){cut++;api.add('wood_low',lv>=2?2:1,t.x,t.y);upd();if(cut>=5){api.msg('솎아베기 끝! 남은 우량목이 더 굵게 자랄 거예요.');api.soon(1.8)}}});
  return {end(){if(cut)S.stand.residue=Math.min(3,S.stand.residue+(F.lv>=3?0:1));return care('thin',cut,bad,5)+` (${SAWN[F.lv]} 사용)`+(cut&&F.lv<3?' 베어 낸 가지가 남았어요. 조림지에서 부산물을 정리해 주세요.':cut?' 하베스터가 가지까지 쳐서 부산물이 남지 않았어요.':'')}}}},
harvest:{name:'벌채',cat:1,sc:'care',cost:25,time:24,noTime:true,noAv:true,howF:()=>`${['손톱으로 밑동을 좌우로 쓱싹쓱싹 문질러 베요. 힘들어요!','엔진톱을 밑동에 대고 문질러 베요.','굴삭기 집게톱으로 밑동을 한 번 쓸어 베요.','하베스터로 나무를 톡 누르면 베고·가지 치고·자르기까지 한 번에!'][Math.min(3,S.up.saw||0)]} 시간 제한 없이 모두 베면 끝나요. 숲 건강도가 품질을 정해요.`,
 init(api){let felled=0;const lossN=Math.min(10,Math.round(12*((S.stand.burnt||[]).length+(S.stand.young||[]).length)/20));const pos=grid(4,3,14,86).slice(0,12-lossN);const lo=gradeP(S.stand.q+bon(S.stand)).lo;const upd=()=>api.stat(`벤 나무 ${felled}/${pos.length}`);upd();
  const F=sawField(api,{strokes:10,rub:api.sz(1)*1.6,trees:pos.map(([x,y])=>{const weak=Math.random()<lo;return {x,y,s:.25,ok:true,svg:SP.ctree(weak?'weak':'good')}}),bad(){},
    cut(t,lv){felled++;upd();if(felled>=pos.length){api.msg('모두베기 끝! 벤 나무를 정리해요.');api.soon(1.8)}const n=lv>=3?3:2;for(let k=0;k<n;k++)api.add(rollGrade(S.stand.q+bon(S.stand)),1,t.x+(k-1)*6,t.y)}});
  return {end(){const st=S.stand;if(!felled)return '한 그루도 베지 않았어요.';Object.assign(S.stand,freshStand(0,50),{cut:true,burnt:[],young:[]});
    return `숲 건강도 ${Math.round(st.q)}에서 ${SAWN[F.lv]}(으)로 나무 ${felled}그루를 베었어요. 남은 나무는 작업단이 마저 정리했어요. 벤 자리는 꼭 다시 심어야(재조림) 비탈 흙이 쓸려 내려가지 않아요.${F.lv<2?'<br>관리 레벨이 오르면 굴삭기·하베스터 같은 임업 기계로 훨씬 빠르게 일할 수 있어요.':''}`}}}},
pest:{name:'재선충병 방제 · 모두베기',cat:1,sc:'care',cost:15,time:24,noTime:true,noAv:true,how:'소나무재선충병이 생긴 숲은 감염목만이 아니라 주변 나무까지 모두 베어요(소규모 모두베기). ① 나무를 두 번 눌러 베요 ② 벤 나무를 눌러 그물망을 씌워요 ③ 그물망 씌운 나무를 눌러 트럭에 실어 옮겨요. 시간 제한 없이 모두 옮기면 끝나요.',

    w.appendChild(b);const tray=k=>{const tr=$('#lvTray');if(!tr.hidden&&tr.dataset.k===k){tr.hidden=true;return}tr.dataset.k=k;tr.hidden=false;tr.innerHTML='';if(k==='blk'){const L=lvBlk();[...LV.peers.values()].forEach(q=>{const on=L.includes(q.key);const x=document.createElement('button');x.className='pzp';x.textContent=(on?'차단 풀기 · ':'차단하기 · ')+(q.me?q.me.name:'이웃');x.onclick=()=>{const B=lvBlk();lvSetBlk(on?B.filter(z=>z!==q.key):[...B,q.key]);toast(on?'차단을 풀었어요.':'차단했어요. 그 사람의 모습과 말이 보이지 않아요.');tr.hidden=true};tr.append(x)});return}
      (k==='emo'?PZ_EMO:PZ_PHR).forEach(t=>{const x=document.createElement('button');x.className=k==='emo'?'pze':'pzp';x.textContent=t;x.onclick=()=>{k==='emo'?liveEmo(t):liveSay(t);tr.hidden=true};tr.append(x)})};
    $('#lvEmo').onclick=()=>tray('emo');$('#lvBlkB').onclick=()=>tray('blk');$('#lvPhr').onclick=()=>tray('phr');$('#lvSend').onclick=()=>{if(liveSay($('#lvIn').value))$('#lvIn').value=''};
    $('#lvIn').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#lvSend').click()}});$('#lvIn').addEventListener('keyup',e=>e.stopPropagation())}
  const ow=others.find(q=>q.owner);$('#lvWho').textContent=!others.length?'차단한 사람만 있어요':ow?`${ow.me.name}님과 함께 있어요`:`${others.map(q=>q.me.name).slice(0,2).join(', ')}${others.length>2?` 외 ${others.length-2}명`:''}님이 함께 있어요`}
function liveSay(v){if(!LV)return false;const t=pzClean(v);if(!t)return false;const now=Date.now();if(now-LV.lastSend<1500){toast('조금 천천히 말해 주세요.');return false}if(t===LV.lastMsg&&now-LV.lastSend<10000){toast('같은 말은 잠시 뒤에 해 주세요.');return false}
  LV.lastSend=now;LV.lastMsg=t;LV.say={t:now,x:t};LV.mySay=t;LV.mySayAt=performance.now();livePres(true);return true}
function liveEmo(e){if(!LV||!PZ_EMO.includes(e))return;LV.emo={t:Date.now(),e};LV.myEmo=e;LV.myEmoAt=performance.now();livePres(true)}
function pushLive(L,dt){if(!LV)return;livePres(false);if(LV.lastMv!==P.moving){LV.lastMv=P.moving;livePres(true)}
  for(const q of LV.peers.values()){if(q.blocked)continue;const dx=q.tx-q.x,dy=q.ty-q.y,d=Math.hypot(dx,dy);if(d>240){q.x=q.tx;q.y=q.ty}else if(d>1){const k=Math.min(1,(dt||.016)*8);q.x+=dx*k;q.y+=dy*k;q.phase+=(dt||.016)*11;q.moving=true}else q.moving=false;
    const m=q.me||cleanMe(null);L.push({t:'person',y:q.y,ref:q,o:{shirt:m.shirt,pants:'#3b3b46',hat:m.hat,hatC:'#2f4a3a',hair:m.hair,name:m.name+(q.owner?' (마을 주인)':''),ring:q.owner}})}}
function bubLive(c){if(!LV)return;const now=performance.now();const B=(x,y,txt,at,big)=>{const a=(now-at)/1000;if(a<0||a>(big?3:6))return;if(big){c.font='24px sans-serif';c.textAlign='center';c.fillText(txt,x,y-74-Math.min(8,a*20))}else bubble(c,x,y-70,txt)};
  if(LV.mySay)B(P.x,P.y,LV.mySay,LV.mySayAt);if(LV.myEmo)B(P.x,P.y,LV.myEmo,LV.myEmoAt,true);
  for(const q of LV.peers.values()){if(q.blocked)continue;if(q.sayTxt)B(q.x,q.y,q.sayTxt,q.sayAt);if(q.emoTxt)B(q.x,q.y,q.emoTxt,q.emoAt,true)}}
const liveHostHere=()=>!!(LV&&S.visiting&&[...LV.peers.values()].some(q=>q.owner&&!q.blocked));

render();
setTimeout(()=>{try{evtPopup()}catch(e){}},1600);
if(!S.created)createChar();
else if(S.fire||S.fireEvt){modal(`<div class="big fire">산불이 아직 타고 있어요!</div><p>${S.fire&&S.fire.loc?LOCN[S.fire.loc]+'에서 ':''}불길이 번지고 있어요. 하루를 그냥 마치면 더 많은 나무가 타요.</p><div class="tbtns"><button class="btn" data-go="fire" style="background:var(--poison)">진화하러 가기</button>${S.fire&&S.fire.loc?'<button class="btn ghost" data-close>현장으로 걸어가기</button>':''}</div>`)}
})();
</script>
